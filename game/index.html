<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7f7f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="王俊琪小恐龙"><title>王俊琪 · 小恐龙跑酷</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f7f7;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;color:#303030}body{display:flex;align-items:center;justify-content:center}#game{position:relative;width:100vw;height:100vh;max-width:1200px;background:#f7f7f7;overflow:hidden;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%}#hint{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;color:#555;transition:opacity .2s}.title{font-size:clamp(26px,7vw,54px);font-weight:800;letter-spacing:2px}.sub{margin-top:10px;font-size:clamp(13px,3.5vw,19px);opacity:.72}#pause{position:absolute;left:18px;top:max(18px,env(safe-area-inset-top));width:42px;height:42px;border:0;background:transparent;font-size:25px;color:#555;display:none}#score{position:absolute;right:20px;top:max(18px,env(safe-area-inset-top));font:700 clamp(15px,3vw,24px)/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}#badge{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-weight:800;font-size:13px;opacity:.35}#restart{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);padding:12px 25px;border:2px solid #444;border-radius:9px;background:#fff;color:#333;font-size:16px;font-weight:700;display:none}@media(max-width:700px){#controls{display:block}.tap-left{position:absolute;left:0;bottom:0;width:58%;height:42%}.tap-right{position:absolute;right:0;bottom:0;width:42%;height:42%}}</style></head><body><div id="game"><canvas id="c"></canvas><div id="badge">王俊琪 · 小恐龙跑酷</div><div id="score">00000</div><button id="pause">Ⅱ</button><div id="hint"><div class="title">点击开始</div><div class="sub">点击屏幕跳跃 · 长按下蹲 · 键盘 ↑ / ↓ / 空格</div></div><button id="restart">再来一次</button><div id="controls"><div class="tap-left"></div><div class="tap-right"></div></div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),hint=document.getElementById('hint'),scoreEl=document.getElementById('score'),restart=document.getElementById('restart'),pause=document.getElementById('pause');let W,H,dpr,ground,scale,last=0,started=false,paused=false,over=false,score=0,best=+localStorage.getItem('wjq_best')||0,speed=430,spawn=0,cloudSpawn=0,obs=[],clouds=[],dust=[];const p={x:90,y:0,w:54,h:54,vy:0,duck:false,onGround:true,run:0};function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);ground=H*.78;scale=Math.min(W/900,H/500);p.x=Math.max(45,W*.1);if(p.onGround)p.y=ground-p.h*scale}addEventListener('resize',resize);resize();function drawDino(){let s=scale;x.save();x.translate(p.x,p.y);x.fillStyle='#333';x.fillRect(3*s,26*s,18*s,12*s);x.fillRect(13*s,18*s,25*s,24*s);x.fillRect(30*s,8*s,16*s,30*s);x.fillRect(37*s,0,26*s,25*s);x.fillRect(48*s,-3*s,17*s,10*s);x.fillRect(53*s,20*s,17*s,4*s);let l=Math.floor(p.run)%2;if(p.duck){x.fillRect(20*s,36*s,35*s,9*s);x.fillRect(45*s,40*s,9*s,10*s)}else{x.fillRect((20+l*10)*s,38*s,8*s,16*s);x.fillRect((38-l*10)*s,38*s,8*s,16*s)}x.fillStyle='#f7f7f7';x.fillRect(56*s,4*s,3*s,3*s);x.fillStyle='#333';x.font=`800 ${Math.max(13,16*s)}px system-ui,"Noto Sans SC",sans-serif`;x.textAlign='center';x.textBaseline='bottom';x.fillText('王俊琪',36*s,-12*s);x.beginPath();x.moveTo(36*s,-6*s);x.lineTo(31*s,0);x.lineTo(41*s,0);x.closePath();x.fill();x.restore()}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#f7f7f7';x.fillRect(0,0,W,H);x.fillStyle='#777';x.beginPath();x.arc(W-75,70,18,0,7);x.fill();x.fillStyle='#e6e6e6';for(let q=-40;q<W+100;q+=220){x.beginPath();x.moveTo(q,ground);x.lineTo(q+70,ground-55);x.lineTo(q+125,ground-20);x.lineTo(q+175,ground-50);x.lineTo(q+220,ground);x.fill()}clouds.forEach(a=>{x.strokeStyle='#bbb';x.lineWidth=2;x.beginPath();x.moveTo(a.x,a.y+8);x.lineTo(a.x+12,a.y+8);x.arc(a.x+22,a.y+8,10,Math.PI,0);x.arc(a.x+34,a.y+5,13,Math.PI,0);x.arc(a.x+49,a.y+8,10,Math.PI,0);x.lineTo(a.x+59,a.y+8);x.stroke()});obs.forEach(o=>{x.fillStyle='#333';if(o.kind==='bird'){x.fillRect(o.x,o.y,34,5);x.fillRect(o.x+10,o.y-5,12,5);x.fillRect(o.x+2,o.y-10,10,5);x.fillRect(o.x+24,o.y-10,10,5)}else{x.fillRect(o.x,ground-o.h,o.w,o.h);x.fillRect(o.x-10,ground-o.h+18,10,8);x.fillRect(o.x-8,ground-o.h+10,8,16);if(o.type>1){x.fillRect(o.x+o.w,ground-o.h+28,10,8);x.fillRect(o.x+o.w,ground-o.h+18,8,18)}}});dust.forEach(a=>{x.fillStyle='#888';x.fillRect(a.x,a.y,3,2)});x.strokeStyle='#444';x.lineWidth=2;x.beginPath();x.moveTo(0,ground);x.lineTo(W,ground);x.stroke();x.fillStyle='#777';for(let q=((score*3)%70)-70;q<W;q+=70){x.fillRect(q,ground+14,8,2);x.fillRect(q+22,ground+7,4,2)}drawDino()}function reset(){score=0;speed=430;spawn=0;cloudSpawn=0;obs=[];clouds=[];dust=[];over=false;paused=false;started=true;p.vy=0;p.duck=false;p.onGround=true;p.y=ground-p.h*scale;hint.style.opacity=0;restart.style.display='none';pause.style.display='block'}function jump(){if(over){reset();return}if(!started){reset();return}if(!paused&&p.onGround){p.vy=-930;p.onGround=false}}function duck(v){if(started&&!over)p.duck=v}function hit(a,b){let ax=a.x+7,ay=a.y+8,aw=a.w*scale-14,ah=a.h*scale-10,bx=b.x+3,by=(b.kind==='bird'?b.y-10:ground-b.h)+2,bw=b.kind==='bird'?32:b.w-6,bh=b.kind==='bird'?18:b.h-4;return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by}function gameover(){over=true;pause.style.display='none';restart.style.display='block';hint.style.opacity=1;hint.querySelector('.title').textContent='游戏结束';hint.querySelector('.sub').textContent=`得分 ${Math.floor(score)} · 最高 ${best} · 点击再来一次`}function update(dt){if(!started||paused||over)return;score+=dt*10;speed=Math.min(760,430+score*1.8);p.run+=dt*10;p.vy+=2350*dt;p.y+=p.vy*dt;if(p.y>=ground-p.h*scale){p.y=ground-p.h*scale;p.vy=0;p.onGround=true}spawn-=dt;if(spawn<=0){let k=Math.random()<.14?'bird':'cactus';obs.push(k==='bird'?{kind:k,x:W+40,y:ground-80-Math.random()*55,w:38,h:18}:{kind:k,x:W+40,w:18+Math.random()*8,h:38+Math.random()*24,type:Math.random()*2});spawn=Math.max(.62,1.25-(speed-430)/1000)+Math.random()*.55}obs.forEach(o=>o.x-=speed*dt);obs=obs.filter(o=>o.x>-100);cloudSpawn-=dt;if(cloudSpawn<=0){clouds.push({x:W+20,y:70+Math.random()*180});cloudSpawn=2.2+Math.random()*3}clouds.forEach(a=>a.x-=speed*.18*dt);clouds=clouds.filter(a=>a.x>-100);if(Math.random()<dt*10&&p.onGround)dust.push({x:p.x+15,y:ground+4});dust.forEach(a=>{a.x-=speed*dt*.3;a.y-=dt*8});dust=dust.filter(a=>a.x>0);for(const o of obs)if(hit(p,o)){best=Math.max(best,Math.floor(score));localStorage.setItem('wjq_best',best);gameover();break}scoreEl.textContent=String(Math.floor(score)).padStart(5,'0')}function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('keydown',e=>{if(['ArrowUp',' ','w','W'].includes(e.key)){e.preventDefault();jump()}if(['ArrowDown','s','S'].includes(e.key)){e.preventDefault();duck(true)}if(e.key==='p'||e.key==='P')toggle()});addEventListener('keyup',e=>{if(['ArrowDown','s','S'].includes(e.key))duck(false)});c.addEventListener('pointerdown',e=>{e.preventDefault();e.clientY<H*.62?jump():duck(true)});c.addEventListener('pointerup',e=>{e.preventDefault();duck(false)});c.addEventListener('pointercancel',()=>duck(false));document.querySelector('.tap-left').addEventListener('pointerdown',jump);document.querySelector('.tap-right').addEventListener('pointerdown',()=>duck(true));document.querySelector('.tap-right').addEventListener('pointerup',()=>duck(false));function toggle(){if(started&&!over){paused=!paused;pause.textContent=paused?'▶':'Ⅱ'}}pause.addEventListener('click',toggle);restart.addEventListener('click',reset)})();</script></body></html>
