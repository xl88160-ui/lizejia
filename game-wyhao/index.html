<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7f7f7"><title>王宇豪 · 小恐龙跑酷</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f7f7;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}#g{position:relative;width:100vw;height:100vh;overflow:hidden;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%}#score{position:absolute;right:20px;top:18px;font:700 20px monospace;color:#333}#name{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-weight:800;font-size:13px;opacity:.38}#hint{position:absolute;top:53%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#444;pointer-events:none}.big{font-size:clamp(28px,7vw,52px);font-weight:800}.small{margin-top:10px;opacity:.7;font-size:14px}#again{display:none;position:absolute;top:63%;left:50%;transform:translateX(-50%);padding:11px 24px;border:2px solid #444;border-radius:8px;background:white;font-weight:700;font-size:16px}</style></head><body><div id="g"><canvas id="c"></canvas><div id="name">王宇豪 · 小恐龙跑酷</div><div id="score">00000</div><div id="hint"><div class="big">点击开始</div><div class="small">点击屏幕跳跃 · 长按下方区域下蹲</div></div><button id="again">再来一次</button></div><script>(()=>{const C=document.getElementById('c'),x=C.getContext('2d'),h=document.getElementById('hint'),a=document.getElementById('again'),se=document.getElementById('score');let W,H,D,G,S=0,best=+localStorage.getItem('wyh_best')||0,on=false,end=false,last=0,sp=0,os=[],cs=[];const p={x:90,y:0,w:54,h:54,vy:0,ground:1,duck:false,run:0};function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;x.setTransform(D,0,0,D,0,0);G=H*.78;p.x=Math.max(45,W*.1);if(p.ground)p.y=G-54}addEventListener('resize',rs);rs();function dino(){let y=p.y;x.save();x.translate(p.x,y);x.fillStyle='#333';x.fillRect(3,26,18,12);x.fillRect(13,18,25,24);x.fillRect(30,8,16,30);x.fillRect(37,0,26,25);x.fillRect(48,-3,17,10);x.fillRect(53,20,17,4);let q=Math.floor(p.run)%2;if(p.duck){x.fillRect(20,36,35,9);x.fillRect(45,40,9,10)}else{x.fillRect(20+q*10,38,8,16);x.fillRect(38-q*10,38,8,16)}x.fillStyle='#f7f7f7';x.fillRect(56,4,3,3);x.fillStyle='#333';x.font='800 16px system-ui,"Noto Sans SC"';x.textAlign='center';x.textBaseline='bottom';x.fillText('王宇豪',36,-12);x.restore()}function draw(){x.fillStyle='#f7f7f7';x.fillRect(0,0,W,H);x.fillStyle='#e6e6e6';for(let q=-40;q<W+100;q+=220){x.beginPath();x.moveTo(q,G);x.lineTo(q+70,G-55);x.lineTo(q+125,G-20);x.lineTo(q+175,G-50);x.lineTo(q+220,G);x.fill()}x.fillStyle='#333';os.forEach(o=>{if(o.b){x.fillRect(o.x,o.y,34,5);x.fillRect(o.x+10,o.y-5,12,5);x.fillRect(o.x+2,o.y-10,10,5);x.fillRect(o.x+24,o.y-10,10,5)}else{x.fillRect(o.x,G-o.h,o.w,o.h);x.fillRect(o.x-9,G-o.h+18,9,8);x.fillRect(o.x-7,G-o.h+10,7,16)}});x.strokeStyle='#444';x.lineWidth=2;x.beginPath();x.moveTo(0,G);x.lineTo(W,G);x.stroke();dino()}function reset(){S=0;sp=0;os=[];on=true;end=false;p.vy=0;p.ground=1;p.duck=false;p.y=G-54;h.style.display='none';a.style.display='none'}function jump(){if(end){reset();return}if(!on){reset();return}if(p.ground){p.vy=-930;p.ground=0}}function hit(o){let ax=p.x+7,ay=p.y+8,aw=p.w-14,ah=p.h-10,bx=o.x,by=o.b?o.y:G-o.h,bw=o.b?34:o.w,bh=o.b?18:o.h;return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by}function update(dt){if(!on||end)return;S+=dt*10;let speed=Math.min(760,430+S*1.8);p.run+=dt*10;p.vy+=2350*dt;p.y+=p.vy*dt;if(p.y>=G-54){p.y=G-54;p.vy=0;p.ground=1}sp-=dt;if(sp<=0){if(Math.random()<.14)os.push({b:1,x:W+40,y:G-100-Math.random()*55});else os.push({b:0,x:W+40,w:18,h:38+Math.random()*24});sp=.75+Math.random()*.8}os.forEach(o=>o.x-=speed*dt);os=os.filter(o=>o.x>-80);for(const o of os)if(hit(o)){best=Math.max(best,Math.floor(S));localStorage.setItem('wyh_best',best);end=true;h.style.display='block';h.querySelector('.big').textContent='游戏结束';h.querySelector('.small').textContent=`得分 ${Math.floor(S)} · 最高 ${best}`;a.style.display='block'}}function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw();se.textContent=String(Math.floor(S)).padStart(5,'0');requestAnimationFrame(loop)}requestAnimationFrame(loop);C.addEventListener('pointerdown',e=>{e.preventDefault();if(e.clientY>H*.62)p.duck=true;else jump()});C.addEventListener('pointerup',()=>p.duck=false);addEventListener('keydown',e=>{if([' ','ArrowUp'].includes(e.key))jump();if(e.key==='ArrowDown')p.duck=true});addEventListener('keyup',e=>{if(e.key==='ArrowDown')p.duck=false});a.onclick=reset})()</script></body></html>
