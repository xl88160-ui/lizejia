<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>李姿莹，我想你了</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% 35%,#fff7fb 0,#fde9f1 35%,#f7dbe7 68%,#edcbdc 100%);color:#7b4b60}
.bg{position:fixed;inset:0;overflow:hidden}.glow{position:absolute;width:55vmax;height:55vmax;border-radius:50%;background:rgba(255,255,255,.38);filter:blur(55px);left:50%;top:34%;transform:translate(-50%,-50%)}
.heart{position:absolute;font-size:18px;opacity:.45;animation:float linear infinite;user-select:none}.heart:nth-child(1){left:8%;bottom:-5%;animation-duration:12s}.heart:nth-child(2){left:22%;bottom:-8%;animation-duration:15s;font-size:25px}.heart:nth-child(3){left:43%;bottom:-6%;animation-duration:11s}.heart:nth-child(4){left:67%;bottom:-7%;animation-duration:14s;font-size:28px}.heart:nth-child(5){left:86%;bottom:-5%;animation-duration:13s}.heart:nth-child(6){left:54%;bottom:-10%;animation-duration:17s;font-size:15px}@keyframes float{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:.45}75%{opacity:.38}100%{transform:translateY(-115vh) scale(1.2) rotate(15deg);opacity:0}}
.card{position:relative;z-index:2;width:min(88vw,680px);height:100%;margin:auto;display:flex;align-items:center;justify-content:center;text-align:center}.inside{padding:42px 25px 52px;border-radius:38px;background:rgba(255,255,255,.27);backdrop-filter:blur(14px);box-shadow:0 25px 80px rgba(125,70,95,.12),inset 0 1px 0 rgba(255,255,255,.7)}
.small{font-size:14px;letter-spacing:.3em;opacity:.7;margin-bottom:20px}.title{margin:0;font-family:"STKaiti","KaiTi",serif;font-size:clamp(40px,10vw,76px);font-weight:500;letter-spacing:.06em;color:#704256;text-shadow:0 2px 18px rgba(255,255,255,.7)}.title em{font-style:normal;color:#a85d78}.line{width:70px;height:2px;margin:27px auto 25px;background:linear-gradient(90deg,transparent,#b97891,transparent);opacity:.6}.sub{font-family:"STKaiti","KaiTi",serif;font-size:clamp(18px,4vw,25px);line-height:2;color:#956477;margin:0}.words{position:fixed;inset:0;z-index:3;pointer-events:none}.word{position:absolute;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.48);box-shadow:0 8px 25px rgba(123,75,96,.08);font-family:"STKaiti","KaiTi",serif;font-size:clamp(17px,4vw,25px);color:#956477;animation:drift 9s ease-in-out infinite}.w1{left:7%;top:17%;animation-delay:-2s}.w2{right:8%;top:25%;animation-delay:-5s}.w3{left:10%;bottom:22%;animation-delay:-7s}.w4{right:9%;bottom:15%;animation-delay:-1s}@keyframes drift{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(10px,-18px) rotate(4deg)}}
.footer{position:fixed;bottom:22px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.18em;opacity:.48}
@media(max-width:500px){.inside{padding:35px 18px 42px;border-radius:30px}.small{font-size:12px}.footer{bottom:14px}.word{font-size:17px}}
</style></head>
<body>
<div class="bg"><div class="glow"></div><span class="heart">♡</span><span class="heart">♥</span><span class="heart">♡</span><span class="heart">♥</span><span class="heart">♡</span><span class="heart">♥</span></div>
<div class="words"><div class="word w1">领导</div><div class="word w2">爱你</div><div class="word w3">喜欢你</div><div class="word w4">想你</div></div>
<main class="card"><section class="inside"><div class="small">给特别的你 · ♡</div><h1 class="title">李姿莹，<br><em>我想你了</em></h1><div class="line"></div><p class="sub">有些想念不用说很多遍<br>只要你知道，就好。</p></section></main>
<div class="footer">愿温柔的风，替我把想念送到你身边</div>
</body></html>
